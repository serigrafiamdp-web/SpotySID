# TEST385 — deploy SpotySID's existing Cloudflare Worker for public Karaoke sync.
# Uses GitHub Actions secrets; never publishes a beta key in source.
name: SpotySID Cloudflare Community Worker

on:
  push:
    branches: [main]
    paths:
      - 'community/api/worker.js'
      - 'community/api/wrangler.toml'
      - '.github/workflows/deploy-community-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotysid-community-worker-deployment
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Worker NOT deployed. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Public Karaoke SAVE requires successful deployment."
            exit 1
          fi
      # TEST415: check token scope and account identity without ever printing
      # credentials or the account ID. Fail closed before touching live D1.
      - name: Validate Cloudflare account and target Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must contain your 32-character Cloudflare Account ID, not the API token or database ID."
            exit 1
          fi
          response_code="$(curl --silent --show-error --output "${RUNNER_TEMP}/cf-workers-list.json" --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          if [ "$response_code" != 200 ]; then
            echo "::error::Cloudflare cannot list Workers for this Account ID (HTTP $response_code). Check Account ID and API token account permissions; Worker was not deployed."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          with open(os.environ["RUNNER_TEMP"] + "/cf-workers-list.json",encoding="utf-8") as f:
              data=json.load(f)
          if data.get("success") is not True or not isinstance(data.get("result"),list):
              sys.exit("ERROR: Cloudflare returned an unexpected Workers list. No deploy.")
          names={w.get("id") for w in data["result"]}
          if "ricos-sid-community" not in names:
              sys.exit("ERROR: ricos-sid-community is not in the selected Cloudflare account. Verify Account ID; no deploy.")
          print("TEST415: Account and existing ricos-sid-community Worker verified.")
          PY
      # TEST414: refuse to deploy if the live Worker has resource bindings
      # missing from source configuration. Existing D1 / R2 assets are never reset.
      - name: Safeguard current Cloudflare bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ricos-sid-community/settings" \
            --output "${RUNNER_TEMP}/spotysid-worker-settings.json"
          python3 - <<'PY'
          import json, os, tomllib, sys
          with open(os.environ["RUNNER_TEMP"] + "/spotysid-worker-settings.json",encoding="utf-8") as f:
              live=json.load(f)
          if live.get("success") is False or not isinstance(live.get("result"),dict):
              sys.exit("ERROR: cannot inspect live Worker bindings. Deploy cancelled.")
          with open("community/api/wrangler.toml","rb") as f:
              cfg=tomllib.load(f)
          defs=set()
          for key in ("d1_databases","r2_buckets","kv_namespaces","services","queues"):
              for row in cfg.get(key,[]):
                  if "binding" in row: defs.add(row["binding"])
          for row in cfg.get("durable_objects",{}).get("bindings",[]):
              if "name" in row: defs.add(row["name"])
          safe_types={"secret_text","plain_text","json","version_metadata"}
          live_bindings=live["result"].get("bindings")
          if not isinstance(live_bindings,list):
              sys.exit("ERROR: Cloudflare did not return the binding list. Deploy cancelled.")
          missing=[(row.get("name"),row.get("type")) for row in live_bindings
                   if row.get("type") not in safe_types and row.get("name") not in defs]
          if missing:
              sys.exit("ERROR: active Worker bindings missing from wrangler.toml: "+
                       ", ".join(name+" ("+str(kind)+")" for name,kind in missing)+
                       ". Deploy blocked to protect existing storage.")
          print("TEST414: Existing Worker resource bindings match configuration.")
          PY
      - name: Deploy existing ricos-sid-community Worker (preserve D1 and secrets)
        working-directory: community/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify Worker capabilities after deploy
        run: |
          node -e "(async()=>{const r=await fetch('https://ricos-sid-community.serigrafiamdp.workers.dev/capabilities');const j=await r.json();if(!r.ok||!j.configured||!j.noHvscArchive)process.exit(1);console.log('Worker capabilities: OK, NO HVSC archive retained');})().catch(e=>{console.error(e);process.exit(1)})"
