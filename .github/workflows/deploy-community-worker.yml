# TEST385 — deploy SpotySID's existing Cloudflare Worker for public Karaoke sync.
# Uses GitHub Actions secrets; never publishes a beta key in source.
name: SpotySID Cloudflare Community Worker

on:
  push:
    branches: [main]
    paths:
      - 'community/api/worker.js'
      - 'community/api/wrangler.toml'
      - '.github/workflows/deploy-community-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotysid-community-worker-deployment
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Worker NOT deployed. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Public Karaoke SAVE requires successful deployment."
            exit 1
          fi
      - name: Deploy existing ricos-sid-community Worker (preserve D1)
        working-directory: community/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
